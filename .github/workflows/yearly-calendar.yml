name: Daily Thailand holiday update

on:
  schedule:
    # 06:30 Asia/Bangkok every day (23:30 UTC on the previous date).
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thailand-holiday-update
  cancel-in-progress: false

jobs:
  update-static-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install holiday sync dependency
        run: python -m pip install httpx

      - name: Update current and next year JSON
        run: python scripts/update_static_holidays.py

      - name: Validate generated holiday JSON
        run: python scripts/validate_holiday_json.py

      - name: Commit holiday changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- frontend/data/holidays; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No holiday changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/holidays
          git commit -m "chore: update Thailand holiday calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: update-static-calendar
    if: needs.update-static-calendar.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updated repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy updated calendar to Pages
        id: deployment
        uses: actions/deploy-pages@v4
