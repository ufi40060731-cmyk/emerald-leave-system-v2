name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check frontend/config.js
      - run: node --check frontend/i18n.js
      - run: node --check frontend/app.js
      - run: node scripts/check_frontend_i18n.js
      - run: python scripts/validate_holiday_json.py

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile rag/*.py
      - run: python -m rag.build_index --output /tmp/emerald-rag-index.json
      - run: python -m unittest discover -s rag/tests -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py app/holiday_sync.py app/rag_service.py app/schedule_service.py
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./data/test.db
          EMERALD_SECRET: ci-only-secret
