name: Build RAG knowledge index

on:
  push:
    branches: ["main"]
    paths:
      - "rag/documents/**"
      - "rag/*.py"
      - "rag/requirements.txt"
      - ".github/workflows/rag-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rag-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Install optional document loaders
        run: python -m pip install -r rag/requirements.txt

      - name: Build knowledge index
        run: python -m rag.build_index

      - name: Test RAG pipeline
        run: python -m unittest discover -s rag/tests -v

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- rag/storage/index.json; then
            echo "RAG index is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rag/storage/index.json
            git commit -m "chore: rebuild RAG knowledge index"
            git push
          fi

      - name: Upload generated index
        uses: actions/upload-artifact@v4
        with:
          name: emerald-rag-index
          path: rag/storage/index.json
          retention-days: 14
