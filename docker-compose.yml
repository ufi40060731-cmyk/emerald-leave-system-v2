services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emerald_leave
      MYSQL_USER: emerald
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me-root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u emerald -pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://emerald:change-me@db:3306/emerald_leave?charset=utf8mb4
      EMERALD_SECRET: replace-this-secret
      ACCESS_TOKEN_MINUTES: "60"
      CORS_ORIGINS: http://localhost:8080
      HOLIDAY_SYNC_KEY: replace-with-a-different-long-random-secret
      HOLIDAY_SOURCE_TIMEOUT_SECONDS: "20"
      HOLIDAY_AUTO_SYNC_ENABLED: "true"
      HOLIDAY_AUTO_SYNC_HOUR: "6"
      HOLIDAY_AUTO_SYNC_MINUTE: "30"
      HOLIDAY_AUTO_SYNC_STARTUP_DELAY_SECONDS: "8"
      RAG_INDEX_PATH: /app/rag/storage/index.json
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
