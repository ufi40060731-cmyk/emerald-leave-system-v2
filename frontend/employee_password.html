<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emerald 員工修改密碼</title>
<style>
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#0f766e;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}.wrap{max-width:620px;margin:36px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 10px 28px rgba(0,0,0,.08);margin-bottom:20px}
h2{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:700}
input,button{width:100%;min-height:44px;border-radius:8px;font:inherit}
input{border:1px solid #cbd5e1;padding:10px 12px}button{border:0;background:#0f766e;color:#fff;font-weight:800;cursor:pointer;margin-top:16px}
button:disabled{opacity:.55}.logout{width:auto;background:#b91c1c;margin:0}.hidden{display:none}
.status{min-height:24px;margin-top:14px;white-space:pre-wrap}.ok{color:#047857}.error{color:#b91c1c}
.info{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:12px;white-space:pre-line;line-height:1.7}
small{color:#64748b}
</style>
</head>
<body>
<header>
  <div><h1>Emerald 員工帳號中心</h1><div>登入與修改密碼</div></div>
  <div id="session" class="hidden"><span id="sessionText"></span> <button id="logout" class="logout">登出</button></div>
</header>

<div class="wrap">
<section id="loginCard" class="card">
  <h2>員工登入</h2>
  <form id="loginForm">
    <label for="account">員工帳號</label>
    <input id="account" placeholder="例如 E004" autocomplete="username" required>
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <button id="loginBtn">登入</button>
  </form>
  <div id="loginStatus" class="status"></div>
</section>

<section id="changeCard" class="card hidden">
  <h2>修改密碼</h2>
  <div id="userInfo" class="info"></div>
  <form id="changeForm">
    <label for="currentPassword">目前密碼</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">新密碼</label>
    <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirmPassword">再次輸入新密碼</label>
    <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
    <button id="changeBtn">確認修改密碼</button>
  </form>
  <p><small>新密碼至少 8 碼；修改成功後會自動登出。</small></p>
  <div id="changeStatus" class="status"></div>
</section>
</div>

<script>
"use strict";
const API = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "";
const KEY="emerald_employee_token";
const $=id=>document.getElementById(id);

function status(el,msg,type=""){el.textContent=msg;el.className="status "+type}
function token(){return sessionStorage.getItem(KEY)||""}
function setToken(v){v?sessionStorage.setItem(KEY,v):sessionStorage.removeItem(KEY)}
async function json(res){const t=await res.text();try{return t?JSON.parse(t):{}}catch{return{detail:t}}}
function err(data,fallback){return typeof data.detail==="string"?data.detail:fallback}
async function api(path,opt={}){
  const h=new Headers(opt.headers||{});
  if(opt.body)h.set("Content-Type","application/json");
  if(token())h.set("Authorization","Bearer "+token());
  return fetch(API+path,{...opt,headers:h});
}
function loggedOut(msg=""){
  setToken("");
  $("loginCard").classList.remove("hidden");
  $("changeCard").classList.add("hidden");
  $("session").classList.add("hidden");
  $("changeForm").reset();
  if(msg)status($("loginStatus"),msg,"ok");
}
function loggedIn(user){
  $("loginCard").classList.add("hidden");
  $("changeCard").classList.remove("hidden");
  $("session").classList.remove("hidden");
  $("sessionText").textContent=user.id+"｜"+user.name+"｜"+user.role;
  $("userInfo").textContent=
    "帳號："+user.id+"\n姓名："+user.name+"\n角色："+user.role+
    "\n部門："+user.department+"\n輪班："+user.rotation_group;
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginBtn").disabled=true; status($("loginStatus"),"登入中…");
  try{
    const res=await fetch(API+"/api/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        account:$("account").value.trim().toUpperCase(),
        password:$("loginPassword").value
      })
    });
    const data=await json(res);
    if(!res.ok)throw new Error(err(data,"登入失敗（"+res.status+"）"));
    setToken(data.access_token); loggedIn(data.user); $("loginForm").reset();
    status($("loginStatus"),""); status($("changeStatus"),"");
  }catch(ex){setToken("");status($("loginStatus"),ex.message,"error")}
  finally{$("loginBtn").disabled=false}
});

$("changeForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("changeBtn").disabled=true; status($("changeStatus"),"修改中…");
  const current=$("currentPassword").value;
  const next=$("newPassword").value;
  const confirm=$("confirmPassword").value;
  try{
    if(next.length<8)throw new Error("新密碼至少需要 8 碼");
    if(next!==confirm)throw new Error("兩次輸入的新密碼不一致");
    if(next===current)throw new Error("新密碼不可與目前密碼相同");
    const res=await api("/api/me/change-password",{
      method:"POST",
      body:JSON.stringify({current_password:current,new_password:next})
    });
    const data=await json(res);
    if(!res.ok)throw new Error(err(data,"修改失敗（"+res.status+"）"));
    loggedOut("密碼修改成功，請使用新密碼重新登入。");
  }catch(ex){status($("changeStatus"),ex.message,"error")}
  finally{$("changeBtn").disabled=false}
});

$("logout").addEventListener("click",()=>loggedOut("已登出。"));

(async()=>{
  if(!token())return loggedOut();
  try{
    const res=await api("/api/me");
    const data=await json(res);
    if(!res.ok)throw new Error(err(data,"登入狀態已失效"));
    loggedIn(data);
  }catch(ex){loggedOut(ex.message)}
})();
</script>
</body>
</html>
