.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-card textarea{min-height:88px;resize:vertical}.form-card button{margin-top:15px}.form-card span{margin-inline-start:10px;color:var(--brand)}.calculation-box{margin:15px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.calculation-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}.calculation-grid span{margin:0;color:var(--muted);font-size:12px}.calculation-grid b{display:block;color:var(--text);font-size:22px;margin-top:3px}.calculation-grid .deduct-total{background:var(--accent);padding:8px;border-radius:9px}.rotation-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}.checkbox-row{display:flex;gap:8px;align-items:center;padding:10px 0}.checkbox-row input{width:auto}.rotation-summary{padding:12px;border-radius:10px;background:var(--accent);font-weight:800;color:var(--brand2);margin-bottom:12px}.override-grid{display:grid;grid-template-columns:1fr 1fr 1fr 2fr auto;gap:9px;align-items:end}.override-grid label{font-size:12px;color:var(--muted)}

attendance-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.attendance-kpis .card{margin-bottom:0}.correction-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}.correction-grid input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;border-radius:9px}.correction-grid .wide{grid-column:span 2}

<body>
<section id="loginView" class="login-shell">
  <div class="login-panel">
    <div class="brand-mark">E</div>
    <h1 data-i18n="app_name">Emerald 企業人資與 SOP 平台</h1>
    <p data-i18n="subtitle">企業人資、出勤、請假與新人 SOP 一站式平台</p>
    <label data-i18n="language">語言</label>
    <select id="loginLanguage" data-i18n-aria-label="language">
      <option value="zh-TW" selected>繁體中文</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
    </select>
    <div class="language-quick" data-i18n-aria-label="language_quick_selection">
      <button type="button" data-language-choice="zh-TW">繁體中文</button>
      <button type="button" data-language-choice="en">English</button>
      <button type="button" data-language-choice="th">ไทย</button>
    </div>
    <label data-i18n="account">帳號</label>
    <input id="loginId" value="HR001" autocomplete="username">
    <label data-i18n="password">密碼</label>
    <input id="loginPassword" value="" type="password" autocomplete="current-password">
    <button class="primary full" id="loginButton" data-i18n="login">登入</button>
    <div class="demo-note"><span data-i18n="demo_accounts_hint">帳號：E001 / E002 / M001 / HR001 / A001（密碼請洽 HR）</span></div>
    <div id="loginError" class="error"></div>
  </div>
</section>

<section id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand-row"><div class="brand-mark small">E</div><div><b>Emerald</b><small data-i18n="company">Emerald Nonwovens</small><small class="build-version">v16.3.6</small></div></div>
    <div class="user-card"><img id="userPhoto" class="user-photo hidden" alt=""><b id="userName"></b><span id="userRole"></span></div>
    <nav id="mainNav"></nav>
    <button class="ghost sidebar-logout" id="logoutButton" data-i18n="logout">登出</button>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h2 id="pageTitle" data-i18n="dashboard">儀表板</h2>
        <p data-i18n="welcome">歡迎使用 Emerald 請假管理系統</p>
      </div>
      <div class="top-actions">
        <input id="globalSearch" data-i18n-placeholder="search" placeholder="搜尋">
        <select id="topLanguage"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="th">ไทย</option></select>
        <button class="ghost" id="themeButton">◐ <span data-i18n="theme">深色模式</span></button>
      </div>
    </header>

    <section class="page active" data-page="dashboard">
      <div class="enterprise-banner"><div><b data-i18n="enterprise_sop"></b><p data-i18n="enterprise_notice"></p></div><button class="soft" data-go="sops" data-i18n="sop_center"></button></div>
      <div class="enterprise-kpis"><div class="enterprise-kpi"><strong id="enterpriseSopPercent">0%</strong><span data-i18n="sop_completion_rate"></span></div><div class="enterprise-kpi"><strong id="enterpriseAttendanceRate">96%</strong><span data-i18n="attendance_rate"></span></div><div class="enterprise-kpi"><strong id="enterpriseSopPending">0</strong><span data-i18n="sop_acknowledge"></span></div></div>
      <div class="announcement"><b data-i18n="announcement">公司公告</b><span data-i18n="announcement_text"></span></div>
      <div class="kpi-grid">
        <article class="card kpi"><strong>12</strong><span data-i18n="balance"></span></article>
        <article class="card kpi"><strong id="pendingCount">2</strong><span data-i18n="pending"></span></article>
        <article class="card kpi"><strong>86</strong><span data-i18n="total_employees"></span></article>
        <article class="card kpi"><strong>94%</strong><span data-i18n="approval_rate"></span></article>
      </div>
